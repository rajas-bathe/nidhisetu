# Local development infrastructure for SIH26265 FDR portal.
# Starts PostgreSQL only by default. MinIO (S3-compatible sample storage used
# by the later document-storage stage) starts with: docker compose --profile storage up -d
name: sih26265-fdr-portal

services:
  postgres:
    image: postgres:16-alpine
    container_name: fdr-postgres
    environment:
      POSTGRES_USER: fdr_portal
      POSTGRES_PASSWORD: fdr_dev_password
      POSTGRES_DB: fdr_portal
    ports:
      # Host port 5433 to avoid clashing with a locally installed PostgreSQL.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdr_portal -d fdr_portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: fdr-minio
    profiles: ["storage"] # not started by default; used by the document-storage stage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fdr_minio_dev
      MINIO_ROOT_PASSWORD: fdr_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
